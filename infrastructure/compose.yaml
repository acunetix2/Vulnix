# Local development services for Vulnix.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vulnix
      POSTGRES_PASSWORD: vulnix
      POSTGRES_DB: vulnix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnix"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
